[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airstage2mqtt"
version = "0.1.0"
description = "A local-only Fujitsu AirStage to MQTT bridge"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "m3zercat" }]
dependencies = [
  "aiomqtt==2.5.1",
  "aiohttp==3.13.5",
  "pyairstage==3.2.2",
  "PyYAML==6.0.3",
]

[project.scripts]
airstage2mqtt = "airstage2mqtt.__main__:main"

[project.urls]
Repository = "https://github.com/m3zercat/AirStage2MQTT"
Issues = "https://github.com/m3zercat/AirStage2MQTT/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["airstage2mqtt"]

[[tool.mypy.overrides]]
module = ["pyairstage", "pyairstage.*"]
ignore_missing_imports = true
