bridge:
  # Generate once with: openssl rand -hex 16
  # This is a stable ownership ID, not a password. Do not change it after deployment.
  key: CHANGE_ME_TO_A_STABLE_RANDOM_KEY

mqtt:
  base_topic: airstage2mqtt

polling:
  interval_seconds: 10
  timeout_seconds: 20
  retries: 5
  offline_after_failures: 2
  reconnect_min_seconds: 1
  reconnect_max_seconds: 30

homeassistant:
  enabled: true
  discovery_prefix: homeassistant

units:
  - name: living_room
    friendly_name: Living Room Air Conditioner
    mac: "E8:FB:1C:00:00:00"
    ip: "192.168.1.40"
    use_https: false
    turn_on_before_set_temperature: false
    # Optional experimental raw diagnostics. Missing/empty means all disabled.
    diagnostics:
      enabled: []
      # enabled:
      #   - error_code
      #   - demand
      #   - power_consumption

  # - name: bedroom
  #   friendly_name: Main Bedroom Air Conditioner
  #   mac: "E8:FB:1C:00:00:01"
